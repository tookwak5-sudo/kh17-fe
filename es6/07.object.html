<script type="text/javascript">
    //모던 자바스크립트로의 변화
    //1. 변수 생성 방식의 변화
    //2. 람다(Lambda) 함수 등장 (=화살표 함수, Arrow function)
    //3. 클래스(class) 등장(x 클래스 방식을 쓰면 너무 경직되서 js의 장점이 사라짐)
    //4. 모듈(module) 등장
    //5. 백틱 구문 등장
    //6. 구조 분해 할당 등장
    // ---------------------------------------------------

    // 6. 구조 분해 할당 (Destructuring Assignment)
    // - 배열이나 객체를 쉽게 해체하기 위한 기법

    const a = [10, 20, 30, 40 ,50];

    //a에서 2개만 뽑아서 a1, a2라고 저장하려면?
    //const a1 = a[0];
    //const a2 = a[1];
    const [a1, a2] = a; //배열에서 앞 두개만 a1, a2에 저장
    console.log(a1, a2);

    //응용
    let b = 10, c = 20;
    [b, c] = [c, b]; //swap 코드
    console.log(b, c);

    //객체도 ?
    const d = {
        no : 1,
        name : "대한민국",
        capital : "서울",
        region : "아시아",
        population : 55000000
    };

    //(Q) d의 이름과 수도만 꺼내서 name, capital이란 변수에 저장해보세요
    //const name = d.name; //변수 중심
    //const capital = d.capital; //변수 중심
    
    const {name, capital} = d; //객체 중심
    console.log(name, capital);

    //(Q) d에서 수도를 "부산"으로 바꿔보기
    //d.capital = "부산";
    //console.log(d);

    const e = {
        ...d, //d의 모든 항목을 그대로 복사하고
        capital : "부산" //capital만 부산으로 재설정
    } ;
    console.log(e);
</script>
