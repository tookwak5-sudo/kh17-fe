<script type="text/javascript">
    //모던 자바스크립트로의 변화
    //1. 변수 생성 방식의 변화
    //2. 람다(Lambda) 함수 등장 (=화살표 함수, Arrow function)
    //3. 클래스(class) 등장(x 클래스 방식을 쓰면 너무 경직되서 js의 장점이 사라짐)
    //4. 모듈(module) 등장
    //5. 백틱 구문 등장
    //6. 구조 분해 할당 등장
    // ---------------------------------------------------
    
    //5. 백틱 구문
    const a = 10;
    const b = 20;
    const c = a + b;

    //ES5
    console.log(a + "와 " + b +"를 더했더니" + c + "이 나오네요");

    //ES6
    // - 백틱 범위를 생성한 뒤 표현식으로 변수를 문자열에 인쇄하여 출력할 수 있음
    // - (주의) JSP에서는 사용 불가 (EL로 해석됨)
    console.log(`${a}와 ${b}를 더했더니 ${c}가 나왔어요`);
</script>
