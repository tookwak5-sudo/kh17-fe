<script type="text/javascript">
    //모던 자바스크립트로의 변화
    //1. 변수 생성 방식의 변화
    //2. 람다(Lambda) 함수 등장 (=화살표 함수, Arrow function)
    //3. 클래스(class) 등장(x 클래스 방식을 쓰면 너무 경직되서 js의 장점이 사라짐)
    //4. 모듈(module) 등장
    //5. 백틱 구문 등장
    //6. 구조 분해 할당 등장
    // ---------------------------------------------------

    // 6. 구조 분해 할당
    //(Q) 다음 두 배열을 합쳐서 새로운 배열을 만들어보세요
    const a = [10, 20, 40];
    const b = [30, 50, 60];

    //ES5
    const c = [];
    
    for(let i = 0; i < a.length; i++){ //a → c
        c.push(a[i]);
    }
    for(let i = 0; i < b.length; i++){ //b → c
        c.push(b[i]);
    }
    for(let i = 0; i < c.length; i++){ //출력
        console.log(c[i]);
    }

    console.log("------");
    //ES6
   
    // - concat 함수 사용
    a.concat(b).forEach(n=>console.log(n));
    
    console.log("------");
    
    // - 전개연산(spread operator) 사용 : '...a'는 'a의 모든 데이터를 풀어헤쳐라'라는 뜻
    [...a, ...b].forEach(n=>console.log(n));
    console.log("------");
    //(Q)  d1 데이터는 두배로, d2 데이터는 제곱해서 두 배열을 합치고 3의 배수만 정렬해서 출력
    const d1 = [10, 20, 30, 40 ,50];
    const d2 = [1, 2, 3, 4, 5];

    //전개연산
    // console.log(result1);
    // console.log(result2);
    [...d1.map(n=>n*2), ...d2.map(n=>n*n)]
        .filter(n=>n%3==0)
        .sort((a,b)=>a-b)
        .forEach(n=>console.log(n));

        console.log("---------");
    //concat
    d1.map(n=>n*2)
        .concat(d2.map(n=>n*n))
        .filter(n=>n%3==0)
        .sort((a,b)=>a-b)
        .forEach(n=>console.log(n));
    
</script>
