<script type="text/javascript">
    
    //(Q) data에 들어 있는 값들을 이용해서 다음 결과를 만들어 내세요
    //1. 홀수만 필터링
    //2. 1번에서 필터링된 결과 데이터를 각각 제곱
    //3. 2번의 결과에서 20 이하만 필터링
    //추가로 알아야 할 함수 : map

    const data = [5, 3, 2, 7, 8, 1, 6];

    //1. 홀수만 필터링
    let result1 = [], result2 = [], result3 = [];
    for(let i = 0; i < data.length; i++){
        if(data[i] % 2 == 1) {
            result1.push(data[i]);
        }
    }

    for(let i = 0; i <result1.length; i++){
        console.log("결과1 : " + result1[i]);
    }

    //2. 필터링된 결과를 각각 제곱
    for(let i =0; i <result1.length; i++){
        var square = result1[i] * result1[i];
        result2.push(square);
    }
    //3. 2번의 결과를 출력
    for(var i=0; i <result2.length; i++){
        if(result2[i] <= 20) {
            result3.push()
        }
    }
    console.log("결과2 : " + result2);
    console.log("--------------");

    //(Q) 만약 다음 배열에서 20을 지우려면?
    const numbers = [10, 20, 30, 40, 50];
    
    //원본이 변경되는 좋지 않은 방식

    // - slice는 원본 변경 없이 원하는 구간을 잘라서 사본을 만들어냄
    // - fileter로 원하는 데이터만 빼고 검색하면 삭제 효과가 발생
    const res = numbers.filter(n =>n !== 20);
    console.log("사본 : " + res);
