<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
    </style>

    <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //목표 : .check-link를 클릭하면 확인창 출력 후 예를 누르면 진행, 아니오를 누르면 차단
            $(".check-link").on("click", function(e){
                // return false; //가능(inline script 방식)
                // e.preventDefault(); //가능(독립형 자바스크립트 방식)

                return confirm("정말 이동하시겠어요?");
            });

            $(".check-form").on("submit", function(e){
                // return confirm("정말?");
                var choice = window.confirm("정말?");
                if(choice == false) e.preventDefault();
            })
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>기본 이벤트의 제어</h1>
        </div>

        <div class="cell">
            <a href="https://www.google.com" class="btn btn-positive w-100 check-link">구글로 이동</a>
        </div>   

        <div class="cell mt-50">
            <form action="https://www.google.com" method="get" class="check-form">
                <button type="submit" class="btn btn-neutral w-100">구글로 이동</button>
            </form>
        </div>
    </div>
</body>
</html>
