<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      /* div { box-shadow: 0 0 0 1px #cccccc} */
    </style>

    <!-- lightpick cdn -->
    <link href="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/css/lightpick.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/lightpick.min.js"></script>


    <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- 자바스크립트 작성 영역 -->
    <script>
        //이 상태로는 적용이 절대 안됨
        //var picker = new Lightpick({ field: document.getElementById('datepicker') });

        $(function(){
            //lightpick 생성

            //js스타일
            //var picker = new Lightpick({field: document.querySelector(".picker-1")});
            //jquery스타일 적용하고 싶지만 현 상태에서는 jquery문법을 알 수 없기 때문에(뒤에 숫자 0을 써줘 지정해주면 됨)
            var picker1 = new Lightpick({field: $(".picker-1")[0]});
            
            var picker2 = new Lightpick({
                field: $(".picker-2")[0],
                format : "YYYY-MM-DD",
            });

            var picker3 = new Lightpick({
                field: $(".picker-3")[0],
                format : "YYYY-MM-DD",
                firstDay : 7 ,
            });

            var picker4 = new Lightpick({
                field: $(".picker-4")[0],
                format : "YYYY-MM-DD",
                firstDay : 7 ,
                minDate : "2026-05-21",
                maxDate : "2026-05-24",
            });

            var picker5 = new Lightpick({
                field: $(".picker-5")[0],
                format : "YYYY-MM-DD",
                firstDay : 7 ,
                // maxDate : moment(),//오늘까지
                maxDate : moment().subtract(1, 'days'), //어제까지
                maxDate : moment().subtract(1, 'weeks'), //지난주까지
            });

            var picker6 = new Lightpick({
                field: $(".picker-6")[0],
                format : "YYYY-MM-DD",
                firstDay : 7 ,
                //minDate : moment(),
                //minDate : moment().add(1, "days"), //내일부터
                //minDate : moment().add(1, "weeks"), //다음주부터
                // minDate : moment().add(1, "weeks").startOf("week").add(1, "days"), //다음주 월요일
                minDate : moment().add(1, "weeks").endOf("week").add(2, "days"),
            });

            var picker7 = new Lightpick({
                field: $(".picker-7")[0],
                format : "YYYY-MM-DD",
                firstDay : 7 ,
                minDate : moment().add(1, "M").startOf("month"), //다음달 1일
                maxDate : moment().add(2, "M").endOf("month"), //다음달 말일
                numberOfMonths : 2, //2달 표시한다
                numberOfColumns : 2, //한 줄에 2줄 표시

                //선택 불가능한 날짜 지정
                disableWeekends : true, //주말 선택금지
                disableDates : [
                    "2026-06-03", "2026-06-06", "2026-07-17",  //단일 날짜를 지정
                    ["2026-07-27", "2026-07-30"], //범위로 지정
                ],
            });

            var picker8 = new Lightpick({
                field: $(".picker-8-1")[0],
                secondField : $(".picker-8-2")[0],
                singleDate : false, //범위선택으로 변경
                format : "YYYY-MM-DD",
                firstDay : 7 ,
                numberOfMonths : 2, //2달 표시한다
                numberOfColumns : 2, //한 줄에 2칸 표시
                selectForward : true, //최초 선택날짜 이후로만 선택가능
                minDays : 3, //최소 선택기간(일)
                maxDays : 7, //최대 선택기간(일)
            });
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>날짜 선택기(Date picker)</h1>
        </div>
    
        <div class="cell">
            <h3>기본형태</h3>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-1">
        </div>

        <div class="cell">
            <h3>날짜형식변경</h3>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-2">
        </div>

        <div class="cell">
            <h3>시작요일변경</h3>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-3">
        </div>

        <div class="cell">
            <h3>날짜범위지정</h3>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-4">
        </div>

        <div class="cell">
            <h3>과거만 선택가능(momentjs 이용)</h3>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-5">
        </div>

        <div class="cell">
            <h3>미래만 선택가능(momentjs 이용)</h3>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-6">
        </div>

        <div class="cell">
            <h3>다음달만 가능(momentjs 이용)</h3>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-7">
        </div>

         <div class="cell">
            <h3>날짜를 범위로 선택(DateRangePicker)</h3>
        </div>
        <div class="cell flex-area" style="align-items: center;">
            <input type="text" class="field w-100 picker-8-1">
            <i class="fa-solid fa-minus ms-10 me-10"></i>
            <input type="text" class="field w-100 picker-8-2">
        </div>
    </div>
</body>
</html>
