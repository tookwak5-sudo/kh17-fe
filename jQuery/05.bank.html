<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
        .target{
            word-break: break-all;
            transition: font-size 2s ease-out;
            font-size: 24px;
        }
    </style>
    <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){

            //금액버튼
            $(".btn-money").on("click", function(){
                //this는 target
                //var moneyButtons = document.querySelectorAll(".btn-money");
                var money = parseInt($(this).data("money"));

                var current = parseInt($(".target").val() || 0);

                var result = current + money;
                $(".target").val(result);
            });

            //한칸 지우기
            $(".btn-delete").on("click", function(){
                // var origin = document.querySelector(".taregt").value;//js
                // var cut = origin.substring(0, origin.length-1);//js
                // document.querySelector(".target").value = cut;//js
                
                var origin = $(".target").val();
                var cut =  origin.substring(0, origin.length-1);
                $(".target").val(cut);
            }); 
            
            //전체 지우기
            $(".btn-clear").on("click", function(){
                //document.querySelector(".target").value = ""; //js
                $(".target").val("");
            });
        });
    </script>
</head>
<body>
     <div class="container w-800 mt-50 mb-50">
        <div class="cell center">
            <h1>이체 금액 입력</h1>
        </div>

        <div class="cell mt-40">
            <input class="field w-100 target right" placeholder="이체할 금액을 입력하세요">
        </div>

        <div class="cell">
            <button type="button" class="btn btn-neutral btn-money" data-money="100000000">억</button>
            <button type="button" class="btn btn-neutral btn-money" data-money="10000000">천만</button>
            <button type="button" class="btn btn-neutral btn-money" data-money="1000000">백만</button>
            <button type="button" class="btn btn-neutral btn-money" data-money="100000">십만</button>
            <button type="button" class="btn btn-neutral btn-money" data-money="10000">만</button>
            <button type="button" class="btn btn-neutral btn-money" data-money="1000">천</button>
            <button type="button" class="btn btn-neutral btn-money" data-money="100">백</button>
            <button type="button" class="btn btn-neutral btn-money" data-money="10">십</button>
            <button type="button" class="btn btn-neutral btn-money" data-money="1">일</button>
            <button type="button" class="btn btn-negative btn-delete">
                <i class="fa-solid fa-delete-left"></i>
            </button>
            <button type="button" class="btn btn-negative btn-clear">
                <i class="fa-solid fa-eraser"></i>
            </button>
        </div>
    </div>
</body>
</html>
