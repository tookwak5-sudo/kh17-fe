<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
        body {
            height : 5123.45px;
        }
    </style>

    <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //scroll, resize 등은 window에 설정해야함
            $(window).on("scroll", function(){
                console.log("스크롤 움직임 감지!");

                //비율, 위치 등을 알고싶다면?
                //-scrollY, scrollTop은 현재 화면의 최상단이 어느정도 위치인지를 알려주는 요소
                // console.log(window.scrollY, document.documentElement.scrollTop);
                //-scrollHeight, clientHeight 등은 현재 화면의 높이를 알려주는 요소
                //-scrollHegiht는 스크롤이 가능한 전체 높이를 반환
                //-clientHeight는 현재 보여지는 화면의 높이를 반환
                //- 이 두 개를 이용해서 scrollY /scrollTop의 최대치를 알아내야함
                const {scrollHeight, clientHeight, scrollTop} = document.documentElement;
                //console.log(scrollHeight,clientHeight);

                const currentScrollY = parseInt( window.scrollY || scrollTop);
                const maxScrollY = parseInt(scrollHeight - clientHeight);
                const percent = currentScrollY * 100 / maxScrollY;
                
                console.log(currentScrollY, maxScrollY, percent);
            });
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>제목</h1>
        </div>
    
        
    </div>
</body>
</html>
