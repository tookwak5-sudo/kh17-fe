<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <title>Document</title>
    
     <!-- lightpick cdn -->
    <link href="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/css/lightpick.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/lightpick.min.js"></script>

    <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript">

        $(function(){
                var picker8 = new Lightpick({
                field: $(".picker-8-1")[0],
                secondField : $(".picker-8-2")[0],
                singleDate : false, //범위선택으로 변경
                format : "YYYY-MM-DD",
                firstDay : 7 ,
                numberOfMonths : 2, //2달 표시한다
                numberOfColumns : 2, //한 줄에 2칸 표시
                selectForward : true, //최초 선택날짜 이후로만 선택가능
                minDays : 1, //최소 선택기간(일)
                //maxDays : 8, //최대 선택기간(일)
            });
        });
    </script>

</head>
<body>
    <form action="./insert" autocomplete="off" method="post" class="form-check">

	<div class="container w-600 mt-50">
		
    	<div class="cell center">
            <h1>일정 등록</h1>
        </div>
        <div class="cell">
        	<label>유형</label>
        	<select class="field w-100" name="deptParentNo">
                <option value="">선택하세요</option>
                <c:forEach var="planDto" items="${list}">
                <option value="${planDto.planNo}">${planDto.planType}</option>
                </c:forEach>
            </select>
        </div>
        <div class="cell">
            <label>일정 <i class="fa-solid fa-asterisk red"></i></label>
        </div>
        <div class="cell flex-area" style="align-items: center;">
            <input type="text" name="planName" class="field w-100 picker-8-1">
                <i class="fa-solid fa-minus ms-10 me-10"></i>
            <input type="text" class="field w-100 picker-8-2">
        </div>
        
         <div class="cell">
            <label>내용</label>
            <textarea name="planExplain" class="field w-100" rows="5"></textarea>
        </div>
        <div class="cell mt-40 right">
        	<a href="./list" class="btn btn-neutral">목록으로</a>
            <button class="btn btn-positive">
                등록하기
            </button>
        </div>
    </div>
</form>
</body>
</html>
