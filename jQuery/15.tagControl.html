<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
    </style>

    <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- 자바스크립트 작성 영역 -->
    <script type="text/javascript"> // 기본적용 type
        $(function(){
            //목표 : btn-create를 클릭하면 create-area에 어떤 화면을 생성
            $(".btn-create").on("click", function(){
                // $(".create-area").text("hello"); // 단순 글자
                // $(".create-area").html("<h1>Hello</h1>"); //HTML태그
                // $(".create-area").html("<div class='cell mt-50'><h1>Hello</h1></div>"); //???!

                //[1]글자로 화면을 만드는 방법(비추천)
                // var content = "";
                // content += "<div class='cell mt-50'>"
                // content += "<h1>Hello</h1>";
                // content += "</div>";
                // $(".create-area").html(content);
                
                
                //[2]jquery에서 태그를 생성해서 설정
                // var div = $("<div>").addClass("cell mt-50");
                // var h1 = $("<h1>").text("Hello");

                // div.html(h1);
                // $(".create-area").html(div);
                
                //[3]template을 불러와서 생성
                var template = $("#html-template").text(); //template은 문자열
                //$(".create-area").html(template);//문자열을 화면으로 추가
                //$ 다음 `.`을 입력하면 jquery내장명령
                var content = $.parseHTML(template); //문자열을 html로 해석하여 저장
                $(content).find(".user").text("피카츄");
                $(".create-area").html(content);
            });
        });
    </script>

    <!-- 화면에 나오지 않으면서 언제든지 불러서 쓸 수 있는 화면 조각(템플릿) -->
    <script type="text/template" id="html-template">
        <div class="cell mt-50">
            <h1>Hello!<span class="user">000</span>님</h1>
        </div>
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>태그 생성 제어</h1>
        </div>
    
        <div class="cell">
            <button type="button" class="btn btn-netural btn-create">태그 만들기</button>
        </div>
        <div class="cell create-area"></div>
        

        <!-- 추가명령 총 4가지 존재 -->
        <div class="cell mt-100">
            <button type="button" class="btn btn-netural btn-before">태그 추가(before)</button>
            <button type="button" class="btn btn-netural btn-prepend">태그 추가(prepend)</button>
            <br><br>
            <button type="button" class="btn btn-netural btn-append">태그 추가(append)</button>
            <button type="button" class="btn btn-netural btn-after">태그 추가(after)</button>
        </div>
        <div class="cell">
            <div class="cell add-area"></div> 
        </div>
    </div>
</body>
</html>
