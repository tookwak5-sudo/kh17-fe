<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JQuery 수업</title>
  <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
  <link rel="stylesheet" href="../css/commons.css" type="text/css">

  <!-- 아이콘-->
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- 디자인을 작성하기 위한 영역-->
  <style>
    div {
      box-shadow: 0 0 0 1px #cccccc
    }
  </style>

  <!-- chartjs CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jQuery CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>



  <!-- 자바스크립트 작성 영역 -->
  <script>
    //지연로딩코드
    $(function () {
      //const ctx = document.querySelector(".custom-chart"); //js 스타일
      const ctx = $(".custom-chart")[0]; //jquery 스타일

      //차트 생성 - NEW chart(태그, {옵션});
      new Chart(ctx, {
        //tye은 차트의 유형(bar/line/pie/doughnut)
        type: 'bar',
        //data는 차트를 그리기 위한 값의 정보
        data: {
          //labels가 x축에 표시될 이름
          labels: ['아시아', '유럽', '아프리카', '남아메리카', '오세아니아', '북아메리카'],
          //datasets은 차트에 그릴 데이터 집합들 (복수계 가능)
          datasets: [
            {
              label: '국가 수', //범례
              data: [11, 10, 9, 4, 3, 4], //표시되는 값
              borderWidth: 1 //테두리 두께
            }
          ]
        },
        //차트를 표시하기 위한 옵션
        options: {
          scales: {
            y: {
              beginAtZero: true //y축을 무조건 0부터 시작
            }
          }
        }
      });
    });
  </script>
</head>

<body>
  <div class="container w-600 mt-50 mb-50">
    <div class="cell center">
      <h1>차트다루기</h1>
    </div>

    <div class="cell">
      <canvas class="custom-chart"></canvas>
    </div>
  </div>
</body>

</html>
