<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
        /* div { box-shadow: 0 0 1px 0 gray; } */
        form {
            padding: 0 !important
        }

        @media (min-width: 992px) {
            .title {
                white-space: nowrap;
            }
        }

        .hover-dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }

        body {
            height: 5000px
        }
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>
    <div class="container my-5">
        <!-- 헤더 영역 -->
        <div class="row mt-4 align-items-center">
            <div class="col-sm-3 d-flex align-items-center">
                <img src="https://www.dummyimage.com/200x50" width="100%">
            </div>
            <div class="col-sm-6 d-flex align-items-center text-center">
                <h1 class="title fs-3 fw-bold">KH정보교육원 스프링개발자 수업자료</h1>
            </div>
            <div class="col-sm-3 d-flex flex-column align-items-center">
                <h2 class="my-0 fs-6">24시간상담</h2>
                <div class="fs-6">1588-0000</div>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg bg-light sticky-top" data-bs-theme="light">
        <div class="container-fluid">

            <!-- Brand 영역 : 메뉴의 가장 좌측에 나오는 글자 혹은 이미지 여역 -->
            <a class="navbar-brand" href="#">KH정보교육원</a>

            <!-- 
                toggler(토글러) 버튼 : 폭이 좁은 경우 메뉴를 접었다 펼쳤다 하도록
                - aria 관련 속성은 리더기를 이용하여 읽어낼 수 있는 접근성 향샹을 위한 속성
                - date-bs-toggle은 이 버튼으로 유발시킬 작업의 종류
                - data-bs-target은 제어 대상을 지정하기 위한 속성
            -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor03"
                aria-controls="navbarColor03" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- 
                    collapse(콜랩스) 영역 : 좁은 화면에서 토글러 버튼에 의해서 접힘/펼침 처리되는 영역
            -->
            <div class="collapse navbar-collapse" id="navbarColor03">
                <!-- 좌측 메뉴 -->
                <ul class="navbar-nav me-auto">
                    <!-- 드롭다운 (drop) 메뉴 (Menu) -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button">
                            <i class="fa-solid fa-database"></i>
                            <span>데이터</span>
                        </a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="#">
                                <i class="fa-solid fa-flag"></i>
                                <span>국가정보</span>
                            </a>
                            <a class="dropdown-item" href="#">
                                <i class="fa-solid fa-chalkboard-user"></i>
                                <span>강좌정보</span>
                            </a>
                            <a class="dropdown-item" href="#">
                                <i class="fa-solid fa-book"></i>
                                <span>도서정보</span>
                            </a>
                        </div>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fa-solid fa-comments"></i>
                            <span>게시판</span>
                        </a>
                    </li>
                </ul>
                <!-- 우측 메뉴 -->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>로그인</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>회원가입</span>
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

     <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/id/10/1940/400" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/id/11/1940/400" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/id/12/1940/400" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

</body>

</html>
