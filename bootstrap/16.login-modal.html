<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력-->
    <link href ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel ="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href ="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
           /* div { box-shadow: 0 0 1px 0 gray; } */
            form { padding: 0 !important}
    </style>

     <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  </head>
  <body>
        <div class="container my-5">
            <!-- 제목 부분을 점보트론(jumbotron_이라고 부른다) -->
             <div class="row">
                <div class="col">
                    <div class="p-4 bg-black text-light rounded">
                        <h1>회원 로그인</h1>
                        <p>모달을 이용하여 로그인 화면을 팝업 형태로 구현합니다</p>
                    </div>
                </div>
             </div>
                <div class="row mt-4">
                        <div class="col text-end">
                                <button type="button" class="btn btn-primary btn-login-open"
                                        data-bs-target="#login-modal" data-bs-toggle="modal">
                                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                                        <span>로그인</span>
                                </button>
                        </div>
                </div>
        </div>

        <!-- 로그인 모달 -->
        <div class="modal fade" tabindex="-1" id="login-modal" data-bs-backdrop="static"> <!-- 배경 영역-->
                <div class="modal-dialog"> <!-- 실제 표시되는 모달 영역-->
                        <div class="modal-content"> <!-- 내용이 작성되는 영역-->
                                <div class="modal-header border-0"> <!-- 상단 영역 (제목, 닫기버튼) -->
                                        <!-- 자동으로 닫고 싶을 경우 bs 옵션 작성 -->
                                        <button type="button" class="btn-close"></button>
                                </div>
                                <div class="modal-body"> <!-- 본문 영역 -->
                                        <div class="container-fulid">
                                                <div class="row">
                                                        <div class="col text-center">
                                                                <h2>회원 로그인</h2>
                                                        </div>
                                                </div>
                                                <div class="row mt-4">
                                                        <label class="col-sm-3 col-form-label">
                                                                아이디
                                                        </label>
                                                        <div class="col-sm-9">
                                                                <input type="text" name="memberId" class="form-control">
                                                        </div>
                                                </div>
                                                   <div class="row mt-4">
                                                        <label class="col-sm-3 col-form-label">
                                                                비밀번호
                                                        </label>
                                                        <div class="col-sm-9">
                                                                <input type="text" name="memberPassword" class="form-control">
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                                <div class="modal-footer border-0"> <!-- 하단 영역 (각종 버튼들)-->
                                        <button type="button" class="btn btn-success btn-login-proc">로그인</button>
                                </div>
                        </div>
                </div>
        </div>

    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src ="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">
            $(function(){ //충돌방지로 보호막 function써주기
                $(".btn-close").click(function(){
                        //닫기를 누르면 입력값 초기화를 한 뒤 입력창을 닫는다
                        $("[name=memberId], [name=memberPassword]").val("");
                        $("#login-modal").modal("hide");
                });
               
                $(".btn-login-proc").click(function(){
                        //모달의 로그인 버튼을 누르면 환영 알림창 + 창닫기
                        window.alert("환영합니다");
                        $("#login-modal").modal("hide");
                });
            });
    </script>

  </body>
</html>
