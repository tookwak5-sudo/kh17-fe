<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력-->
    <link href ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel ="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href ="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
           /* div { box-shadow: 0 0 1px 0 gray; } */
            form { padding: 0 !important}
    </style>

     <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  </head>
  <div class="container my-5">
            <!-- 제목 부분을 점보트론(jumbotron_이라고 부른다) -->
             <div class="row">
                <div class="col">
                    <div class="p-4 bg-black text-light rounded">
                        <h1>국가 목록</h1>
                    </div>
                    <div class="cell">
                       1-10 / 42
                   </div>
            <!-- 인라인 폼 -->
            <div class="row">
                <div class="col">
                <form autocomplete="off">
                    <select name="column" class="field">
                        <option value="country_name">국가명</option>
                        <option value="country_region">대륙명</option>
                        <option value="country_capital">수도명</option>
                    </select>
                    <input type="text" name="keyword" required
                            class="field" placeholder="검색어 입력">
                    <button type="submit" class="btn btn-positive">
                        <i class="fa-solid fa-magnifying-glass"></i>
                            <span>검색</span>
                    </button>
                </form>
                </div>
            </div>
            <div class="cell right">
                <a href="#" class="btn btn-neutral">신규등록하기</a>
            </div>
          
            <!-- 데이터 테이블 -->

            <div class="cell">
                <table class="table">
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>대륙</th>
                            <th>이름</th>
                            <th>수도</th>
                            <th>인구</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>아시아</td>
                            <td>대한민국</td>
                            <td>서울</td>
                            <td class="right">55,000,000</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>아시아</td>
                            <td>중국</td>
                            <td>베이징</td>
                            <td class="right">145,000,000</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>아시아</td>
                            <td>일본</td>
                            <td>도쿄</td>
                            <td class="right">123,000,000</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>유럽</td>
                            <td>영국</td>
                            <td>런던</td>
                            <td class="right">67,000,000</td>
                        </tr>
                        <tr>
                            <td>5</td>
                            <td>유럽</td>
                            <td>프랑스</td>
                            <td>파리</td>
                            <td class="right">59,000,000</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="cell">
                <div class="pagination">
                    <a href="#">
                        <i class="fa-solid fa-chevron-left"></i>
                         
                    </a>
                    <a href="#" class="on">1</a>
                    <a href="#">2</a>
                    <a href="#">3</a>
                    <a href="#">4</a>
                    <a href="#">5</a>
                    <a href="#">6</a>
                    <a href="#">7</a>
                    <a href="#">8</a>
                    <a href="#">9</a>
                    <a href="#">10</a>
                    <a href="#">
                       <i class="fa-solid fa-chevron-right"></i>
                    </a>
                </div>
            </div>
        </div>
</body>
</html>
