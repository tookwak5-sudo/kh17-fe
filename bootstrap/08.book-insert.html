<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력-->
    <link href ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel ="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href ="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
          form { padding: 0 !important}
    </style>

     <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
        <div class="container my-5">
            <!-- 제목 부분을 점보트론(jumbotron_이라고 부른다) -->
             <div class="row">
                <div class="col">
                    <div class="p-4 bg-black text-light rounded">
                        <h1>신규도서 등록</h1>
                        <p>신규 도서 등록하기</p>
                    </div>
                </div>
             </div>

             <!-- 실제로 구현할 내용들 -->
              <form autocomplete="off" method="post" enctype="multipart/form-data">
                    <div class="row mt-4">
                        <label class="col-sm-3 col-form-label">
                            도서명<i class="fa-solid fa-asterisk text-danger"></i>
                        </label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" name="bookTitle">
                            <div class="valid-feedback">올바른 형식입니다</div>
                            <div class="invalid-feedback">필수 항목입니다</div>
                        </div>
                    </div>
                    
                    <div class="row mt-4">
                        <label class="col-sm-3 col-form-label">
                            지은이
                        </label>
                        <div class="col-sm-9">
                        <input type="text" class="form-control" name="bookAuthor">
                        </div>
                    </div>
                    <div class="row mt-4">
                        <label class="col-sm-3 col-form-label">출간일</label>
                        <div class="col-sm-9">
                        <input type="date" name="bookPublicationDate"
                                class="form-control">
                        </div>
                    </div>

                    <div class="row mt-4">
                        <label class="col-sm-3 col-form-label">
                            판매가<i class="fa-solid fa-asterisk text-danger"></i>
                        </label>
                        <div class="col-sm-9">
                        <input type="text" inputmode="numeric" name="bookPrice"
                                class="form-control">
                        </div>
                    </div>
                    <div class="row mt-4">
                        <label class="col-sm-3 col-form-label">
                            페이지<i class="fa-solid fa-asterisk text-danger"></i>
                        </label>
                        <div class="col-sm-9">
                        <input type="text" inputmode="numeric" name="bookPage"
                            class="form-control">
                        </div>
                    </div>
                    <div class="row mt-4">
                        <label class="col-sm-3 col-form-label">
                            장르 <i class="fa-solid fa-asterisk text-danger"></i>
                        </label>
                        <div class="col-sm-9">
                        <select class="form-select" name="bookGenre">
                            <option value="">선택</option>
                            <option>판타지</option>
                            <option>교양</option>
                            <option>소설</option>
                            <option>역사</option>
                            <option>과학</option>
                            <option>추리소설</option>
                            <option>자기계발</option>
                            <option>수험서</option>
                        </select>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <label class="col-sm-3 col-form-label">표지</label>
                        <div class="col-sm-9">
                        <input type="file" name="attach" accept=".png, .jpg" multiple
                                class="form-control">
                        </div>
                    </div>
                    <div class="row mt-4 text-end">
                        <div class="col">
                        <a href="#" class="btn btn-outline-info">목록으로</a>
                        <button type="submit" class="btn btn-outline-success">
                                등록
                        </button>
                        </div>
                    </div>
                </form>
        </div>

    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src ="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script>
        $(function(){
             //상태객체
            var state = {
                bookTitleValid : false,
                bookAuthorValid : true, //선택항목(true)
                bookPublisherValid : true,
                bookPublicationDateValid : true,
                bookPriceValid : false,
                bookPageCountValid : false,
                bookGenreValid : false,

                ok : function() {
                    return Object.values(this)//이 객체의 모든 이름에 대한 값을 반환해라
                    .filter(v => typeof v == "boolean") // boolean값만 추출해서
                    .every(v => v === true); //모두 true인지 확인해서 반환해라;
                }
            };

            //개별 입력창
            $("[name=bookTitle]").on("blur", function(){
                var valid = $(this).val().length > 0;
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookTitleValid = valid;
            });

            $("[name=bookAuthor]").on("blur", function(){
                var regex = /^[^!@#$]+$/;
                var valid = $(this).val().length == 0 || regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookAuthorValid = valid;
            });

            $("[name=bookPublisher]").on("blur", function(){
                $(this).addClass("success");
                state.bookPublisherValid = true;
            });

            $("[name=bookPublicationDate]").on("blur", function(){
                var regex = /^([0-9]{4})-(((02)-(0[1-9]|1[0-9]|2[0-9]))|((0[469]|11)-(0[1-9]|1[0-9]|2[0-9]|30))|((0[13578]|1[02])-(0[1-9]|1[0-9]|2[0-9]|3[01])))$/;
                // var valid = regex.test(this.value);
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                bookPublicationDateValid = valid;
            });

            $("[name=bookPrice]").on("blur", function(){
                var price = parseInt($(this).val());
                // 상한선이 없으면 숫자가 커질 시 e-22와 같은 방식으로 표현이 되기 때문에 상한선 표기
                var valid = price >= 0 && price <= 1000000000; 
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                bookPriceValid = valid;
            });

            $("[name=bookPageCount]").on("blur", function(){
                var pages = parseInt($(this).val());
                var valid = pages >= 0;
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                bookPageCountValid = valid;
            });

            $("[name=bookGenre]").on("input", function(){
                var regex = /^(판타지|교양|소설|역사|과학|추리소설|자기계발|수험서)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                bookGenreValid = valid;
            });

            //숫자처리
             $("[inputmode=numeric]").on("input", function(){
                var originValue = $(this).val(); //숫자지만 실제로는 문자열로 처리를 하고 있기 때문에
                var replaceValue = originValue.replace(/[^0-9]/g, ""); //replace에 g를 붙인 것과 = replaceAll이 동일          
                $(this).val(parseInt(replaceValue || 0));
             });

            //폼 검사
            $(".form-check").on("submit", function(){
                //화면처리(이벤트 트리거)
                $(this).find("select[name]").trigger("input"); 
                $("input[name], textarea[name]").trigger("blur");

                return state.ok(); //stat.ok() 상태에 따라 전송해!
             });
             /*
                (+추가) 파일 처리
                - [name=attach]에 input이벤트가 발생하면 선택된 파일이 있을 경우 .preview에 미리보기 표시
                (1) 진짜로 파일을 읽어와서 미리보기가 가능한 형태의 src를 생성하나 뒤 설정하는 방법
                - 장점 : 브라우저 무관하고 동일한 처리가 가능

                - 단점 : 오래걸리고 코드 작성 난이도가 높음
                (2) 브라우저가 제공하는 미리보기 기능을 활용하는 방법
                - 장점 : 파일을 읽을 필요가 없음
                - 단점 : 생성한 주소를 반드시 수동으로 제거해야 메모리 관리가 가능
             */
            $("[name=attach]").on("input", function(){
                //this = 파일 입력창 (files라는 내부 입력창이 존재)
                
                //blob : binary lob 대용량 정보
                //clob : charactor lob 대용량 글자
                // if(이미 만들어진 파일이 있다면){
                //     제거를 하라!
                // }
                var originSrc = $(".preview").attr("src"); //현재 .priviewd의 src를 가져와서
                if(originSrc.startsWith("blob:")) { //생성된 주소가 존재한다면
                    URL.revokeObjectURL(originSrc); //생성된 주소를 제거(회수)하세요
                    console.log("기존 이미지를 제거했습니다");

                }

                //files는 자바스크립트 속성이기 때문에 아래와 같이 작성
                if(this.files.length > 0) { // 파일을 선택한 경우 (1개) (미리보기 생성)
                    var address = URL.createObjectURL(this.files[0]); // 파일을 주고 주소 생성 요청
                    $(".preview").attr("src", address); //이미지의 주소로 설정
                    
                }
                else{ // 파일을 취소한 경우 (미리보기 제거)
                    //.preview에 src를 "https://dummyimage.com/200x200?text=NO"로 설정
                    $(".preview").attr("src", "https://dummyimage.com/200x200?text=NO");
                }
            });

        });
    </script>

  </body>
</html>
