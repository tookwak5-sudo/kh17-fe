<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력-->
    <link href ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel ="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href ="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
           /* div { box-shadow: 0 0 1px 0 gray; } */
            form { padding: 0 !important}

            @media (min-width: 992px) {
                .title {
                    white-space: nowrap;
                }
            }
            .hover-dropdown:hover .dropdown-menu {
                display: block;
                margin-top: 0;
            }
    </style>

     <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  </head>
  <body>
        <div class="container my-5">
            <!-- 헤더 영역 -->
             <div class="row mt-4 align-items-center">
                <div class="col-sm-3 d-flex align-items-center">
                        <img src="https://www.dummyimage.com/200x50" width="100%">
                </div>
                <div class="col-sm-6 d-flex align-items-center">
                    <h1 class="title fs-3 fw-bold">KH정보교육원 스프링개발자 수업자료</h1>
                </div>
                <div class="col-sm-3 d-flex flex-column align-items-center">
                    <h2 class="my-0 fs-6">24시간상담</h2>
                    <div class="fs-6">1588-0000</div>    
                </div>
             </div>

             <!-- 메뉴 -->
             <div class="row mt-4 bg-primary text-white p-2">
                <div class="col d-flex justify-content-between flex-wrap">
                    <ul class="nav nav-pills">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <i class="fa-solid fa-house"></i>
                                <span class="d-none d-sm-inline">홈</span>
                            </a>
                        </li>
                        <li class="nav-item dropdown hover-dropdown">
                            <a class="nav-link dropdown-toggle text-white" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">
                                <i class="fa-solid fa-database"></i>
                                <span class="d-none d-sm-inline">데이터</span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">국가정보</a></li>
                                <li><a class="dropdown-item" href="#">강좌정보</a></li>
                                <li><a class="dropdown-item" href="#">도서정보</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <i class="fa-solid fa-comments"></i>
                                <span class="d-none d-sm-inline">게시판</span>
                            </a>
                        </li>
                    </ul>
                    <ul class="nav nav-pills">
                        <li class="nav-item dropdown hover-dropdown">
                            <a class="nav-link dropdown-toggle text-white" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                <span class="d-none d-sm-inline">로그인</span>
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" href="#">
                                        <i class="fa-solid fa-user-plus"></i>
                                        <span>회원가입</span>
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
             </div>
        </div>

    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src ="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

  </body>
</html>
