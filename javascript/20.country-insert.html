<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피드백 디자인 실습</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      /* div { box-shadow: 0 0 0 1px #cccccc} */
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        function checkCountryRegion(){
            var tag = document.querySelector("[name=countryRegion]"); //태그 선택     
            // var valid = tag.value.length > 0; // 빈칸만 아니면 됨
            var regex = /^(아시아|아프리카|[남북]아메리카|유럽|오세아니아)$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid; //결과를 반환하게 해야 다른곳에서 사용이 가능
        }
        function checkCountryName(){
            var tag = document.querySelector("[name=countryName]"); //태그 선택
            var regex = /^[가-힣]{1,10}$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function checkCountryCapital(){
            var tag = document.querySelector("[name=countryCapital]"); //태그 선택
            // var regex = /^[가-힣]{1,12}$/;
            // var valid = regex.test(tag.value);
            var bytes = getByteLength(tag.value);
            var valid = 0 < bytes && bytes <= 36;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }

        function getByteLength(str){
            return new TextEncoder().encode(str).length;
        }

        //숫자 입력 필드는 숫자만 입력 되도록 처리하는 것이 좋을 수도 있다
        function filterCountryPopulation() {
            var tag = document.querySelector("[name=countryPopulation]");
            var regex = /[^0-9]+/g; //g(lobal)를 붙이면 개수 제한 없이 다 적용됨
            var replacement = tag.value.replace(regex, "");
            tag.value = replacement;
        }

        function checkCountryPopulation(){
            var tag = document.querySelector("[name=countryPopulation]"); //태그 선택
            // var valid = parseInt(tag.value || 0) > 0; //tag.value가 비어있으면 0으로 대체
            var valid = tag.value.length > 0 && parseInt(tag.value) > 0;
            
            // 음수만 아니면
            // var regex = /^[0-9]+$/;
            // var valid = regex.test(tag.value);

            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }

        //폼 최종 전송 가능 여부 판정
        function checkForm() {
            //만약에 내가 검사하기 싫으니까
            var valid1 = checkCountryRegion();
            var valid2 = checkCountryName();
            var valid3 = checkCountryCapital();
            var valid4 = checkCountryPopulation();

            var valid = valid1 && valid2 && valid3 && valid4;
            
            if(valid == false){
                return false
            }
            
            return true;
        }

    </script>
</head>
<body>
   <form method="post" enctype="multipart/form-data" autocomplete="off" 
            onsubmit="return checkForm();">
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
             <h1>국가 정보 등록</h1>
        </div>

        <div class="cell">
            <label>대륙명<i class="fa-solid fa-asterisk red"></i></label>
            <select class="field w-100" name="countryRegion" oninput="checkCountryRegion()"> 
                <option value="">선택하세요</option>
                <option>아시아</option>
                <option>아프리카</option>
                <option>북아메리카</option>
                <option>남아메리카</option>
                <option>유럽</option>
                <option>오세아니아</option>
            </select>
            <!-- <div class="success-feedback"></div> -->
            <div class="fail-feedback">필수 항목입니다</div>
        </div>

        <div class="cell">
            <label>국가명<i class="fa-solid fa-asterisk red"></i></label>
            <!-- onblur입력을 마치고 나가면 실행 <-> onfocus -->
            <input type="text" name="countryName" class="field w-100" onblur="checkCountryName();"> 
            <div class="success-feedback">올바른 형식의 이름입니다</div>
            <div class="fail-feedback">한글 10글자 이내로만 작성 가능합니다</div>
        </div>

        <div class="cell">
            <label>수도명<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="countryCapital" class="field w-100" onblur="checkCountryCapital();">
            <div class="fail-feedback">미입력이거나 허용 크기를 초과했습니다</div>
        </div>

        <div class="cell">
            <label>인구<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric" name="countryPopulation" 
                class="field w-100" 
                oninput="filterCountryPopulation();"
                onblur="checkCountryPopulation();">
            <div class="fail-feedback">0보다 큰 숫자만 가능합니다</div>
        </div>

        <div class="cell">
            <button type="submit" class="btn btn-positive w-100">신규 등록</button>
        </div>

    </div>

   </form>
</body>
</html>
