<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //app 대신 익명함수를 직접 연결
        window.onload = function() { 
            // 원래 앱에서 작성하던 코드를 이곳에 작성
            var btn = document.querySelector(".btn");
            btn.onclick = function() {
                //changeColor의 코드를 이곳에 작성
                var target = document.querySelector(".target");
                target.style.color = "red";
            };
        };

        // 현재 방식의 문제점 : 중복된 이벤트 설정이 불가능
        // window.onload = function() { 
        //     // 원래 앱에서 작성하던 코드를 이곳에 작성
        //     var btn = document.querySelector(".btn");
        //     btn.onclick = function() {
        //         //changeColor의 코드를 이곳에 작성
        //         var target = document.querySelector(".target");
        //         target.style.backgroundColor = "yellow";
        //     };
        // };
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>독립형 자바스크립트</h1>
        </div>

        <div class="cell">
            <button type="button" class="btn btn-positive w-100">색상변경</button>
        </div>
        <div class="cell">
            <h2 class="target">Hello JavaScript!</h2>
        </div>
    </div>
</body>
</html>
