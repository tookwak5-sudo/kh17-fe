<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
      
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        function checkmemberId() {
            var id = document.querySelector("[name=checkId]");
            

            var regex =/^[a-z][a-z0-9]{4,19}$/;
            var confirmId = document.querySelector(".confirmId");
            if(regex.test(id.value)){
                confirmId.style.color = "blue";
                confirmId.textContent = "멋진 아이디입니다.";

            }
            else{
                confirmId.style.color = "red";
                confirmId.textContent = "영문 대문자, 소문자, 숫자, 특수문자를 반드시 1개 이상 포함한 8~16글자로 작성하세요";
            }
        }

        function checkmemberPassword() {
            var pw = document.querySelector("[name=checkPw]");

            var regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,16}$/;
            
            var confirmPw = document.querySelector(".confirmPw");
            
            if(regex.test(pw.value)){
                confirmPw.style.color = "blue";
                confirmPw.textContent = "올바른 비밀번호 형식입니다."
            }
            else{
                confirmPw.style.color = "red";
                confirmPw.textContent = "영문 대문자, 소문자, 숫자, 특수문자를 반드시 1개 이상 포함한 8~16글자로 작성하세요";
            }
            
        }
        function crossCheck(){
            // 두 입력창의 값 가져오기
            var pw = document.querySelector("[name=checkPw]");
            var crossPw = document.querySelector("[name=crossPw]");

            var outPw = document.querySelector(".outPw");
            if(pw.value == crossPw.value){
                outPw.style.color = "blue";
                outPw.textContent = "비밀번호가 일치합니다.";
            }
            else{
                outPw.style.color = "red";
                outPw.textContent = "비밀번호가 일치하지 않습니다.";
            }
        }
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>회원가입</h1>
        </div>
        <div>
            <div>
            <span>아이디 <i class="fa-solid fa-star-of-life red"></i></span>
            </div>
            <input name="checkId" type="text" class="field" onInput="checkmemberId()">
            <div>
            <span class="confirmId" style="font-size: 14px; padding: 0.1em"></span>
            </div>
        </div>

        <div>
            <div>
            <span>비밀번호 <i class="fa-solid fa-star-of-life red"></i></span>
            </div>
            <input name="checkPw" type="text" class="field" onInput="checkmemberPassword()"> 
            <div>
            <span class="confirmPw" style="font-size: 14px;"></span>
            </div>
        </div>

        <div>
            <div>
            <span>비밀번호 확인 <i class="fa-solid fa-star-of-life red"></i></span>
            </div>
            <input name="crossPw" type="text" class="field" onInput="crossCheck()"> 
            <div>
            <span class="outPw" style="font-size: 14px;"></span>
            </div>
        </div>
    </div>
</body>
</html>
