<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트</title>
    <script>
        //화면과 연결할 함수
        function sayHello(){
            console.log("안녕하세요");
        }

        function getTotal(){
            var total = 0;
            for(var i = 1; i <= 50; i++){
                total += i;
            }
            console.log(total);
        }

    </script>
</head>
<body>
    <!-- 버튼 클릭 시 sayHello 함수를 부르도록 인라인 스크립트 작성 -->
    <button type="button" onclick="sayHello();">눌러보세요</button>

    <button type="button" onclick="getTotal();">1부터 50까지 더하면 얼마일까여?</button>
</body>
</html>
