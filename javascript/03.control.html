<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어문</title>

    <script>
        //자바 순서
        //데이터 → (조건 → 반복 = 제어문(control statement)) → 배열 → 클래스
        //window.prompt("아무거나 입력해보세요");

        //자바스크립트의 제어문(조건, 반복문)
        //- 자바와 동일(if, switch, for, while, do-while)

        //(ex) 홀짝 구분
        var number = 10;

        if(number % 2 == 0){
            console.log("짝수");
        }
        else{
            console.log("홀수");
        }

        //(ex) 1~10까지 더해서 출ㄹ격
        // var total = 1 + 2 + 3 ... + 10
        var total = 0;
        for(var i = 1; i <= 10; i++){
            total += i;
        }
        console.log("total = " + total);
    </script>
</head>
<body>
    
</body>
</html>
