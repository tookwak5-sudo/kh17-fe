<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        window.addEventListener("load", function(){
            var countryNameValid = false; // 필수항목은 처음에 false로 설정하기(검사가 필요하기 때문에)

            //입력창 검사
            document.querySelector("[name=countryName]").addEventListener("blur", function(){
                //this = 입력창
                var regex = /^[가-힣]{1,10}$/;
                var valid = regex.test(this.value); //입력창의 입력값을 테스트
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                //return valid: //의미 없는 코드(내가 부르는게 아니라 얻어낼 수 없음);
                countryNameValid = valid;
            });
            //폼 검사
            document.querySelector(".form-check").addEventListener("submit", function(e){
                // return false;
                if(countryNameValid == false) {
                    e.preventDefault();
                }
            });
        });
    </script>
</head>
<body>
    <form action="" method="post" autocomplete="off" class="form-check">

        <div class="container w-600 mt-50 mb-50">
            <div class="cell center">
                <h1>입력폼(input form) 검사</h1>
            </div>

            <div class="cell">
                <label>국가명<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="countryName" class="field w-100">
                <div class="success-feedback">올바른 형식의 이름입니다</div>
                <div class="fail-feedback">한글로만 작성 가능합니다</div>
            </div>
        
            <div class="cell mt-50">
                <button type="submit" class="btn btn-positive w-100">등록하기</button>
            </div>     
        </div>

    </form>
</body>
</html>
