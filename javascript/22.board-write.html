<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      /* div { box-shadow: 0 0 0 1px #cccccc} */
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        function checkBoardTitle() {
            var tag = document.querySelector("[name=boardTitle]");
            var valid = tag.value.length > 0;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function checkBoardHead() {
            var tag = document.querySelector("[name=boardHead]");
            var regex = /^(공지|유머|자유|정보)$/;
            var valid = tag.value.length == 0 || regex.test(tag.value);
            tag.classList.add("success");
            return true;
        }
        function checkBoardContent() {
            var tag = document.querySelector("[name=boardContent]");
            var valid = tag.value.length > 0 && tag.value <= 1000;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }

        function checkForm() {
            var boardTitleValid = checkBoardTitle();
            var boardHeadValid = checkBoardHead();
            var boardContentValid = checkBoardContent();
            return boardTitleValid && boardHeadValid && boardContentValid;
            // return checkBoardTitle() && checkBoardHead() && checkBaordContent(); //안됨!! 첫번째 것만 적용됨..
        }

        //글자수 계산
          function calculateBoardContent() {
            var tag = document.querySelector("[name=boardContent]");
            var size = tag.value.length;

            var span = tag.nextElementSibling.children[0];
            span.textContent = size;
            
            var valid = size <= 1000;
            if(valid) {
                span.classList.remove("red");
            }
            else {
                span.classList.add("red");
            }
        }
    </script>
</head>
<body>
    <form action="./writer" method="post" enctype="multipart/form-data" autocomplete="off"
            onsubmit="return checkForm();">
        
        <div class="container w-800 mt-50 mb-50">
            
            <!--  제목창을 답글일 때와 새글일 때로 나눠서 처리  -->
            <div class="cell">
                <c:if test="${param.boardParent == null}">	
                <h1>신규 글 작성</h1>
                </c:if>
                <c:if test="${param.boardParent != null}">	
                <h1>답글 작성</h1>
                </c:if>
                <p>타인에 대한 무분별한 비방글은 경고 없이 삭제될 수 있습니다</p>
            </div>

            <c:if test="${param.boardParent != null}">
            <input type="hidden" name="boardParent" value="${param.boardParent}">
            </c:if>
            
            <div class="cell">
                <label>제목<i class="fa-solid fa-asterisk red"></i></label> 
                <input type="text" name="boardTitle" class="field w-100" onblur="checkBoardTitle();">
                <div class="success-feedback">제목 설정이 완료되었습니다</div>
                <div class="fail-feedback">필수 입력 항목입니다</div>
            </div>
            
            <div class="cell mb-0">
                <label>구분</label> 
                <select name="boardHead" class="field w-100" oninput="checkBoardHead();">
                <option value="">선택 안함</option>
                
                <!-- 공지는 관리자만 보이도록 해야함 -->
                <c:if test="${sessionScope.loginLevel == '마스터'}">
                <option value="공지">공지</option>
                </c:if>
                
                <option value="유머">유머</option>
                <option value="자유">자유</option>
                <option value="정보">정보</option>
            </select>
            </div>
            
            <div class="cell">
                <label>내용<i class="fa-solid fa-asterisk red"></i></label>
                <textarea name="boardContent" class="field w-100" rows="10" 
                            oninput="calculateBoardContent();"
                            onblur="checkBoardContent();"></textarea>
                <div class="cell right">
                    <span>0</span> / 1000 글자
                </div>
                <div class="success-feedback">입력이 완료되었습니다</div>
                <div class="fail-feedback">내용은 필수항목이며 1000글자 이내로 작성해야합니다</div>
            </div>
            <div class="cell mt-40">
                <a href="#" class="btn btn-netural">목록으로 이동</a>
                <button class="btn btn-positive"><i class="fa-solid fa-plus"></i>등록</button>
            </div>
        </div>
    </form>
</body>
</html>
