<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        window.addEventListener("load", function(){
            //상태 객체
            var state = {
                lectureTitleValid : false,
                lectureCategoryValid : false,
                lectureDurationValid : false,
                lecturePriceValid : false,
                lectureTypeValid : false,
                ok : function() {
                    return this.lectureTitleValid && this.lectureCategoryValid
                     && this.lectureDurationValid && this.lecturePriceValid
                      && this.lectureTypeValid;
                }
            };

            //학목별 이벤트 처리

            document.querySelector("[name=lectureTitle]").addEventListener("blur", function(){
                var valid = this.value.length > 0;
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                lectureTitleValid = valid;
            });
            document.querySelector("[name=lectureCategory]").addEventListener("input", function(){
                var regex = /^(이론|실습|시험)$/;
                var valid = regex.test(this.value);
                this.classList.remove("success","fail");
                this.classList.add(valid ? "success" : "fail");
                lectureCategoryValid = valid;
            });
            document.querySelector("[name=lectureDuration]").addEventListener("input", function(){
                var originValue = this.value;
                var replaceValue = originValue.replace(/[^0-9]/g, "");
                this.value =parseInt(replaceValue || 0);
            });
            document.querySelector("[name=lectureDuration]").addEventListener("blur", function(){
                var duration = parseInt(this.value); // NaN 나올 수 없음
                var valid = duration <= 300 && duration % 30 == 0; //좋은 습관 범위를 줄이고 검사를 시작!
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                lectureDurationValid = valid;
            });
            document.querySelector("[name=lecturePrice]").addEventListener("input", function(){
                var originValue = this.value;
                var replaceValue = originValue.replace(/[^0-9]/g, "");
                this.value =parseInt(replaceValue || 0);
            });
            document.querySelector("[name=lecturePrice]").addEventListener("blur", function(){
                var price = parseInt(this.value);
                var valid = price >= 0 && price <= 100000000;
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                lecturePriceValid = valid;
            });
            document.querySelector("[name=lectureType]").addEventListener("input", function(){
                var regex = /^(온라인|오프라인|혼합)$/;
                var valid = regex.test(this.value);
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                lectureTypeValid = valid;
            });

            //폼 전송 처리
            document.querySelector(".form-check").addEventListener("submit", function(e){
                //입력창 상태 갱신처리
                document.querySelector("[name=lectureTitle]").dispatchEvent(new Event('blur'));
                document.querySelector("[name=lectureCategory]").dispatchEvent(new Event('input'));
                document.querySelector("[name=lectureDuration]").dispatchEvent(new Event('blur'));
                document.querySelector("[name=lecturePrice]").dispatchEvent(new Event('blur'));
                document.querySelector("[name=lectureType]").dispatchEvent(new Event('input'));

                if(state.ok() == false){
                    e.preventDefault();
                }
            });
        });
    </script>
</head>
<body>
     <form action="" method="post" enctype="multipart/form-data"  autocomplete="off" class="form-check">
        <div class="container w-600 mt-50 mb-50">
            <div class="cell center">
                <h1>강좌 정보 등록</h1>
            </div>

            <div class="cell mt-40">
                <label>강좌명 <i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="lectureTitle" placeholder="e.g., 정보처리 산업기사"
                    class="field w-100" onblur="checkLectureTitle();">
                <div class="success-feedback">올바른 형식입니다</div>
                <div class="fail-feedback">필수 항목입니다</div>
            </div>

            <div class="cell">
                <label>카테고리 <i class="fa-solid fa-asterisk red"></i></label>
                <select name="lectureCategory" class="field w-100" oninput="checkLectureCategory();">
                    <option value="">선택하세요</option>
                    <option>이론</option>
                    <option>실습</option>
                    <option>시험</option>
                </select>
                <div class="fail-feedback">필수 선택 항목입니다</div>
            </div>

            <div class="cell">
                <label>강의시간 <i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" inputmode="numeric" name="lectureDuration" class="field w-100"
                        value="0" oninput="filterLectureDuration();"
                            onblur="checkLectureDuration();">
                <div class="success-feedback">강의시간이 설정되었습니다</div>
                <div class="fail-feedback">30시간 단위로 최대 300시간 이내에서 설정 가능합니다</div>
            </div>

            <div class="cell">
                <label>수강료 <i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" inputmode="numeric" name="lecturePrice" class="field w-100"
                    value="0" oninput="filterLecturePrice();" onblur="checkLecturePrice();">
                <div class="success-feedback">수강료가 설정되었습니다</div>
                <div class="fail-feedback">수강료는 0 이상으로 설정해야 합니다</div>
            </div>

            <div class="cell">
                <label>강의형태 <i class="fa-solid fa-asterisk red"></i></label>
                <select name="lectureType" class="field w-100" oninput="checkLectureType();">
                    <option value="">선택하세요</option>
                    <option>온라인</option>
                    <option>오프라인</option>
                    <option>혼합</option>
                </select>
                <div class="fail-feedback">필수 선택 항목입니다</div>
            </div>

            <div class="cell mt-50">
                <label>미리보기</label>
                <input type="file" name="attach" accept=".png, .jpg" multiple class="field w-100">
            </div>

            <div class="cell mt-50">
                <button type="submit" class="btn btn-positive w-100">
                    <i class="fa-solid fa-plus"></i>
                    <span>신규 강좌 개설하기</span>
                </button>
            </div>

        </div>

    </form>
</body>
</html>
