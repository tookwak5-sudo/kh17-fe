<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        function wordCount() {
            //[1] 입력창을 선택하세요
            var target = document.querySelector(".target");
            //[2] 글자 수를 계산하세요
            var size = target.value.length;
            

            //[3] 글자 수 표시영역을
            var count = document.querySelector(".count");
            count.textContent = size;

            //(+번외) 최대 글자 수를 표현
            var maxSize = document.querySelector(".maxSize");
            var limit = 10;
            maxSize.textContent = limit;
            
            // [4] 제한 글자 수를 넘어가면 글자수를 빨강으로 표기
            if(size > limit){
               target.style.color = "red";
            }
            else{
                target.style.color = "black";
            }

        }
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>자기 소개서</h1>
        </div>
        <div>
            <span>(Q) 가장 최근에 관심있게 본 IT 소식은 무엇입니까?</span>
        </div>
        <div class="cell center">
            <textarea class="field w-100 target" rows='5' oninput="wordCount()"></textarea>
        </div>
        
        <div class="cell right">
            <span class="count">0</span> / <span class="maxSize">1000</span>
        </div>
    </div>
</body>
</html>
