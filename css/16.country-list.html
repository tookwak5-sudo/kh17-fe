<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="./images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="./commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
        *{/* 전체에게 설정한다 */
            /* 이제부터 폭과 높이는 테두리가 기준 */
             box-sizing: border-box;
        }
        /* 
            테이블 디자인
            - 테이블은 다양한 태그가 조합된 구조를 가진다
            - 최상위 태그인 ㅡtable>에 클래스를 부여하고 나머지는 탐색
            - 연계 선택자 : 하위, 후순 선택자

            후손 선택자
            - .table th 와 같이 띄어쓰기로 내부에 포함된 요소임을 명시 
            - 테이블이 중첩된 경우 원치 않는 대상이 선택될 수 있음

            자식(하위) 선택자
            - .table > thead > tr > th 와 같이 부등호 표시로 연결
        */
        .table {
            width: 100%;
            border: 1px solid #2d3436;
            border-collapse: collapse;
        }

        .table > thead > tr > th, 
        .table > tbody > tr > td
        {
            border: 1px solid #2d3436
        }

        .table > tbody {
            text-align: center;
        }
    </style>

</head>
<body>
        <div class="container w-600">

            <div class="cell center">
                <h1>국가 목록</h1>
            </div>
            <!-- 인라인 폼 -->
            <div class="cell center">
                <form autocomplete="off">
                    <select name="column" class="field">
                        <option value="country_name">국가명</option>
                        <option value="country_region">대륙명</option>
                        <option value="country_capital">수도명</option>
                    </select>
                    <input type="text" name="keyword" required
                            class="field" placeholder="검색어 입력">
                    <button type="submit" class="btn btn-positive">
                        <i class="fa-solid fa-magnifying-glass"></i>
                            <span>검색</span>
                    </button>
                </form>
            </div>
            <div class="cell right">
                <a href="#" class="btn btn-neutral">신규등록하기</a>
            </div>
            <div class="cell">
                1-10 / 42
            </div>

            <!-- 데이터 테이블 -->

            <div class="cell">
                <table class="table">
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>대륙</th>
                            <th>이름</th>
                            <th>수도</th>
                            <th>인구</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>아시아</td>
                            <td>대한민국</td>
                            <td>서울</td>
                            <td class="right">55,000,000</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>아시아</td>
                            <td>중국</td>
                            <td>베이징</td>
                            <td class="right">145,000,000</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>아시아</td>
                            <td>일본</td>
                            <td>도쿄</td>
                            <td class="right">123,000,000</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>유럽</td>
                            <td>영국</td>
                            <td>런던</td>
                            <td class="right">67,000,000</td>
                        </tr>
                        <tr>
                            <td>5</td>
                            <td>유럽</td>
                            <td>프랑스</td>
                            <td>파리</td>
                            <td class="right">59,000,000</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="cell">
                Pagenation
            </div>
        </div>
</body>
</html>
