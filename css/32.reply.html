<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery 수업</title>
    <link rel="icon" href="../css/images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      div { box-shadow: 0 0 0 1px #cccccc}
    </style>

    <!-- jQuery CDN -->
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- 자바스크립트 작성 영역 -->
   <script type="text/javascript">
	$(function(){
        var params = new URLSearchParams(window.location.search);
        var boardNo = params.get("boardNo");
		//시작하자 마자 목록 불러오기
		 $.ajax({
            url: "/rest/reply/list",
            method: "post",
            data: {
                replyOrigin : boardNo
            },
            success: function(response) {
                //console.log(response);
                //response는 백엔드에서의 List<ReplyDto>이다
                //반복을 통해 template을 배치하고 정보를 갈아끼운다
                for(var i = 0; i < response.length; i++){
                	var template = $("#reply-template"); //템플릿(id주었음)을 불러와서
                	var html = $.parseHTML(template); //HTML로 변환하고
                	$(".reply-area").append(html); //화면에 추가
                }
            }
        });
        
        //등록 버튼을 누르면 발생할 등록 작업
		$(".btn-reply").on("click", function(){
            var replyContent = $(".field-reply").val();
            if(replyContent.length == 0) return; //입력값이 없으면 차단처리

			$.ajax({
				url: "/rest/reply/write",		
				method: "post",
				data: {
					replyContent : replyContent,
                    replyOrigin : boardNo
				},
                success: function(){
                    console.log("등록완료");
                    $(".field-reply").val(""); //입력값 삭제
                }
			});
		});
	});
</script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>제목</h1>
        </div>
        <div class="cell">
		<div class="flex-area flex-vertical">
			<div class="outer">
				<div class="inner">
					<div class="flex-area">
						<div class="image-area flex-area flex-center">
							<div class="center">
								<img src="http://dummyimage.com/80" width="100%" height="100%" class="image-circle">
							</div>
						</div>

                        <div class="content -area flex-fill">
                            <div class="writer">
                                작성자누구누구
                            </div>
                            <div class="detail mt-20">
                                <span>댓글내용</span>
                            </div>

                            <div class="mt-10">
                                <span>작성일/수정일</span>
                            </div>
                        </div>
					</div>
				</div>
			</div>
		</div>
	</div>
        
    </div>
</body>
</html>
