<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="./images/kh로고.jpg" type="image/jpeg">
    <link rel="stylesheet" href="./commons.css" type="text/css">

    <!-- 아이콘-->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
      
    </style>

</head>
<body>
    <div class="container center">
        <div class="cell center">
            <h1>자유 게시판</h1>
        </div>
        <div class="cell left">
            <a href="#" class="btn btn-netural">글쓰기</a>
        </div>
        <div class="cell">
            <table class="table">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>작성일</th>
                        <th>조회수</th>
                        <th>좋아요</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>1번</td>
                        <td>테스트유저1</td>
                        <td>2025-05-04</td>
                        <td>21</td>
                        <td>30</td>
                    </tr>
                     <tr>
                        <td>2</td>
                        <td>2번</td>
                        <td>테스트유저2</td>
                        <td>2025-05-04</td>
                        <td>21</td>
                        <td>50</td>
                    </tr>
                     <tr>
                        <td>3</td>
                        <td>3번</td>
                        <td>테스트유저3</td>
                        <td>2025-05-04</td>
                        <td>21</td>
                        <td>30</td>
                    </tr>
                     <tr>
                        <td>4</td>
                        <td>4번</td>
                        <td>테스트유저4</td>
                        <td>2025-05-04</td>
                        <td>21</td>
                        <td>30</td>
                    </tr>
                     <tr>
                        <td>5</td>
                        <td>5번</td>
                        <td>테스트유저5</td>
                        <td>2025-05-04</td>
                        <td>21</td>
                        <td>30</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="cell">
            <div class="pagination on">
                <a href="#">이전</a>
                <a href="#" class="on">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#">6</a>
                <a href="#">7</a>
                <a href="#">8</a>
                <a href="#">9</a>
                <a href="#">10</a>
                <a href="#">다음</a>
            </div>
        </div>
        <div class="cell center">
            <form autocomplete="off">
                <select name="column" class="field">
                    <option value="board_title">제목</option>
                    <option value="board_writer">작성자</option>
                </select>
                <input type="text" name="keyword" required
                    class="field" placeholder="검색어 입력">
                <button type="submit" class="btn btn-positive">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>검색</span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
