<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="/images/insta.jpg" type="image/jpeg">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
            /* 완전 무식디자인 */
            *{
                /* 이제부터 폭과 높이 는 테두리가 기준이야 */
                box-sizing: border-box;
            }

            body{
                text-align: center;
            }
            hr{
                width: 530px;
                margin-top: 20px;
                margin-bottom: 100px;
            }
            h3{
                width: 530px;
                text-align: left;
                margin: 30px auto;
            }
            input[name=memberId], input[name=memberPassword] {
                display: block;
                width: 530px;
                margin: 15px auto;
                font-family: sans-serif;
                font-size: 20px;
                padding: 0.75em; 
                border-radius: 0.5em; /* 0.5em -> 글짜 반 개정도 */
                outline: none;
                border-style: solid;
                border-color: rgb(165, 172, 179);
                border-width: 1px;
            }
            button{
                display: block;
                width: 530px;
                margin: 15px auto;
                font-family: sans-serif;
                font-size: 20px;
                padding: 0.5em; 
                background-color: rgb(73, 73, 241);
                border-color: gray;
                border-radius: 100px;
                color: white;
                font-width: bold;
            }
            a{
                color: #1e272e;
                text-decoration: none;
                font-size: 16px;
                font-weight: bold;        
            }
    </style>

</head>
<body>
    
    <img src="/images/insta.jpg" alt="표지 사진" width="100">     
    <div>


    </div>
    <hr>
    <h3>Instagram으로 로그인</h3>
    <form autocomplete="off">
        <input type="text" name="memberId" required 
                placeholder="휴대폰번호, 사용자 이름 또는 이메일 주소">
        
        <input type="password" name="memberPassword" required
                placeholder="비밀번호">
       
        <button>로그인</button>
    </form>
        <a href="#">비밀번호를 잊으셨나요?</a>
</body>
</html>
