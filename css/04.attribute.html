<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh로고.jpg" type="image/jpeg">

    <!-- 디자인을 작성하기 위한 영역-->
    <style>
        *{/* 전체에게 설정한다 */
            /* 이제부터 폭과 높이는 테두리가 기준 */
             box-sizing: border-box;
        }
        input{
            /* 글꼴 속성(font) */
            font-family: 굴림, sans-serif;
            font-size: 24px; 
        }
        .first {
            /* 글꼴 속성(font) */
            font-family: 굴림, sans-serif;
            font-size: 24px; 
            /* 기본 글씨 크기 16px */
            /* font-weight: 400; */
            /* 기본 글씨 굵기 400 */
            /* font-style: italic; -- 촌스러움*/
            /* 배경속성 (background) */
            
            /* CSS1 */
            /* background-color: #8c7ae6; */

            /* CSS3 */
            /* background: #EEAECA; */
            /* background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%); */
        }
        .second {
            /* 테두리 디자인 (border-*) */
          border-width: 2px;
          border-style: solid;
          /* border-style 기본값: inset 그래서 solid*/
          border-color: #78e08f;

          /* 한번에 쓰기 */
          /* border: 2px solid #78e08f; */

          border-radius: 5px;
          /* border-radius: 100px; */
          /* border-radius: 50%; 전체적인 비율을 깎기 때문에 원- 폭이랑 길이 같은 경우 비율 주면 원 */

          /* 입력창과 같이 focus효과가 있는 경우 제거하는 속성 */
          /* 클릭해도 색깔이 변하지 않음 */
          outline: none;

          /* 내부 여백 (padding) 
             - 글자가 중요한 태그라면(input, button 등) em을 쓸 수 있음
             - 1em은 글자1개의 높이
             - px로도 부여할 수 있으나 상황에 맞게 선택하여 부여
             - 부위별 부여도 가능(top, bottom, left, right)
             - 2개로 나눠쓰면 상하 / 좌우
             - 4개로 나눠쓰면 12시 / 3시 / 6시 /9시
          */
          /* padding: 15px; */
          /* padding: 1em; */
          /* padding: 0.5em 1em;  */
          /* padding: 5px 15px 15px 20px; */
          padding: 0.5em;
          padding-left: 2em;
        }
        .third{
            /* 
                크기 설정 (width, hegiht)
            */
            width: 300px;
           
        }
    </style>

</head>
<body>
    <h1>기본 디자인 속성들</h1>
    <input type="text" class="first">
    <br><br>
    <input type="text" class="second">
    <br><br>
    <input type="text" class="third">
</body>
</html>
