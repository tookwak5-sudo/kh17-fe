<!-- 
    Doctype은 문서의 유형과 버전을 정의할 때 사용 
    - html 이라고만 말하면  HTML 버전 5를 의미한다(HTML5)
    - version 4 이하를 사용하고 싶다면 태그 정보를 옆에 주소 형태로 적어야 한다

    <html>은 문서의 범위를 설정할 때 사용하지만 안만들어도 자동생성이 된다
        <head>에는 일반적으로 문서의 정보와 화면에 표시되지 않는 도구들을 작성한다
            <meta>는 이 문서를 외부에서 바라봤을 때 알 수 있는 정보들이다
            <title>문서의 제목
            <link> 외부와 연결
        <body>에는 일반적으로 실제 화면에 표시될 내용들을 작성한다
-->
 
<!DOCTYPE html> <!-- 이 문서는 html 버전 5를 사용하고 있다-->
<html lang="ko">
<head>
    <meta charset="UTF-8"> <!-- utf-8로 만들어짐-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--                -->   <!-- 화면을 장치에 맞춰라 --> <!-- 내가 설정한(여기선 1.0) 크기 설정을 유지하세요-->
    <title>디자인 예제</title>
    
    <!-- favicon 설정 -->
    <link rel="icon" href="/kh로고.jpg" type="image/jpeg">

</head>
<body>
    
</body>
</html>
