<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 로그인</title>
    <link rel="icon" href="./images/kakao.png" type="image/png">

    <!-- 디자인을 작성하기 위한 영역-->
    <link rel="stylesheet" href="./commons.css" type="text/css">
    <style>
          /* 영역을 시각적으로 보이게 만드는 테스트 코드 */
        div{
            /* box-shadow: 우 하 번짐 퍼짐 색상; */
            box-shadow: 0 0 1px 0 #808e9b;
        }
        /* 
            폭 유틸리티 클래스 
            - 50px 단위로 설정할 수 있도록 구현
            - 200px ~ 1200px까지 구현 (대부분의 홈페이지를 보면 1200~1300을 넘어가는 곳이 없음 - 한 눈에 보이는 것이 중요)
            - w→ 로 구현
        */
        .w-200 { width: 200px;}
        .w-250 { width: 250px;}
        .w-300 { width: 300px;}
        .w-350 { width: 350px;}
        .w-400 { width: 400px;}
        .w-450 { width: 450px;}
        .w-500 { width: 500px;}
        .w-550 { width: 550px;}
        .w-600 { width: 600px;}
        .w-650 { width: 650px;}
        .w-700 { width: 700px;}
        .w-750 { width: 750px;}
        .w-800 { width: 800px;}
        .w-850 { width: 850px;}
        .w-900 { width: 900px;}
        .w-950 { width: 950px;}
        .w-1000 { width: 1000px;}
        .w-1050 { width: 1050px;}
        .w-1100 { width: 1100px;}
        .w-1150 { width: 1150px;}
        .w-1200 { width: 1200px;}
        

        input[name=memberId],  input[name=memberPassword] {
            width: 100%;
            font-size: 20px;
            padding: 0.75em;
            outline: none;
        }
         input[name=memberId]{
            border:none;
            border-bottom: 2px solid #ccc;
         }  
         input[name=memberPassword] {
            border:none;
            border-bottom: 2px solid #ccc;
         }
         button{
             width: 100%;
            font-family: sans-serif;
            
            font-size: 15px;
            padding: 0.8em; 
            border:none;
            color: black;
            font-width: bold;
         }
         .login button{
            background-color: rgb(254, 229, 0);
         }
    </style>
</head>
<body>
    <div class="container w-450" style="margin-top: 50px">
        <div class="cell center">
            <img src="./images/kakao.png" width="100">
        </div>
        <div class="cell" style="margin-top: 40px; margin-bottom: 0;">
            <input type="text" name="memberId" required
                    placeholder="카카오메일 아이디, 이메일, 비밀번호">
        </div>
        <div class="cell" style="margin-top: 0">
            <input type="text" name="memberPassword" required
                    placeholder="비밀번호">
        </div>
        <div class="cell login">
             <button class="btn-login">로그인</button>
        </div>
        <hr>
        <div class="cell" style="background-color: #808e9b; margin-top: 20px;">
           <button class="btn-passkey">QR코드 로그인</button>
        </div>
    </div>   
</body>
</html>
