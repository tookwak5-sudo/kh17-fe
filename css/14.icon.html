<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>디자인 수업</title>
    <link rel="icon" href="./images/kh로고.jpg" type="image/jpeg">
    <!-- 디자인을 작성하기 위한 영역-->
    <link rel="stylesheet" href="./commons.css" type="text/css">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        *{/* 전체에게 설정한다 */
            /* 이제부터 폭과 높이는 테두리가 기준 */
             box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container w-500 mt-50">
        <div class="cell center">
                <h1>아이콘 다루기(font Awesome 7)</h1>
        </div>
        <!--
            <태그의 의미>
            i 태그는 원래 이텔리체를 표시하기 위한 태그로 만들어졌다
            사람들이 생각보다 많이 안쓰는 문제가 생김(font-style 쓰면 되니까... )
            Font Awesome 개발자가 이런 생각을...
            "어차피 잘 안쓰니까 i를 icon의 i라고 치고 쓰게 하자!"
            
            그래서 i태그로 예시를 제공해준다 (원래 다른 태그도 가능)

            ---------------------------------------
            <클래스의 의미>

            fa는 Font Awesome의 줄임말

            .fa-solid는 "속이 채워진 도형"을 의미
            .fa-regular는 "속이 비워진 도형"을 의미
            .fa-brands는 "기업 로고 도형"을 의미

            그 뒤에 나오는 클래스는 도형의 종류를 의미
        -->

        <div class="cell">
            <i class="fa-solid fa-star"></i>
            <i class="fa-regular fa-star"></i>
        </div>

        <!-- (Q) 속이 꽉찬 허트, 비어있는 하트-->
        <div class="cell">
            <i class="fa-solid fa-heart"></i>
            <i class="fa-regular fa-heart"></i>
        </div>

        <!-- 
            [icon의 장점] 글자처럼 취급된다
            - 색상을 color로 바꿀 수 있다
            - 크기를 font-size로 바꿀 수 있다
            - 즉, 글자와 가장 자연스러운 배치가 가능
        -->

        <div class="cell" style="color:red;">
            <i class="fa-solid fa-heart">
                325
            </i>
        </div>
        <div class="cell" style="color: gold">
            <i class="fa-solid fa-star">
                3248
            </i>
        </div>
        <div class="cell" style="color: blue" font-size= 25px>
            <i class="fa-solid fa-eye"></i> 552
            <br>
            <i class="fa-regular fa-comment-dots"></i>71
        </div>

        <!-- [아이콘의 장범] 크기 배율 클래스가 존재 -->
        <div class="cell">
            <i class="fa-brands fa-youtube"></i>
            <i class="fa-brands fa-youtube fa-2x"></i>
            <i class="fa-brands fa-youtube fa-3x"></i>
            <i class="fa-brands fa-youtube fa-4x"></i>
            <i class="fa-brands fa-youtube fa-5x"></i>
            <i class="fa-brands fa-youtube fa-6x"></i>
            <i class="fa-brands fa-youtube fa-7x"></i>
            <i class="fa-brands fa-youtube fa-8x"></i>
            <i class="fa-brands fa-youtube fa-9x"></i>
            <i class="fa-brands fa-youtube fa-10x"></i>
        </div>

        <div class="cell">
            <i class="fa-branch fa-kakao-talk"></i>
        </div>

        <!-- 
            [아이콘 장점] 애니메이션 기능
        -->
        <div class="cell">
            <i class="fa-solid fa-heart red fa-beat"></i>
            <i class="fa-solid fa-exclamation fa-fade fa-beat orange"></i>
            <i class="fa-solid fa-thumbs-up fa-bounce blue"></i>
            <i class="fa-brands fa-btc fa-flip gold"></i>
            <i class="fa-solid fa-bell fa-shake"></i>
            <i class="fa-solid fa-gear fa-spin pink"></i>
        </div>

        <!-- 
            [아이콘 장점] 버튼 내부에 글자처럼 사용 가능
        -->
        <div class="cell">
            <button class="btn btn-positive w-100">
                <i class="fa-solid fa-plus"></i>
                등록하기
            </button>

        </div>
        <!-- (Q)회원가입, 로그인버튼, 이전버튼, 다음버튼, 목록버튼 -->
         <div class="cell">
            <button class="btn btn-positive">
                <i class="fa-solid fa-user-plus white"></i>
                회원가입
            </button>
            <button class="btn btn-positive">
                <i class="fa-solid fa-right-to-bracket"></i>
                로그인
            </button>
            <button class="btn btn-positive">
                <i class="fa-solid fa-right-from-bracket"></i>
                로그아웃
            </button>
            
            <button class="btn btn-positive">
                <i class="fa-solid fa-chevron-left"></i>
                이전글
            </button>
            <button class="btn btn-positive">
                다음글
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <a href="#" class="btn btn-netural black">
                <i class="fa-solid fa-list"></i>
            </a>
         </div>
    </div>    
</body>
</html>
