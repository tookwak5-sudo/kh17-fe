<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일 태그 사용법</title>
    <link rel="icon" href="/kh로고.jpg" type="image/jpeg">
</head>
<body>
    <!-- [팁] ALT + ↓ 을 누르면 현재 선택한 영역 또는 커서가 있는 줄이 복제된다-->

    <!--
         일일이 디자인하기는 어려우니 외부에 디자인 전용 영역을 생성하도록 구현
         <style>태그 생성해서 대상을 지정(선택)한 후 디자인 코드를 작성
         대상을 선택하기 위한 구문을 선택자(selector)라고 부른다

         [장점] 재사용가능, 가독성 높다
         [단점] 선택자를 공부해야한다 (원하는 것만 선택하기 위한 공부)
     -->
    <style>
        /* 태그 선택자 : 태그명으로 선택 */
        h1{
            color: violet;
            background-color: black;
        }
        /* 아이디 선택자 : 아이디를 이용해서 선택 */
        #title{
            border: 5px solid violet;
        }
        /* 클래스 선택자 : 여러 클래스 중 지정한 클래스를 가진 대상을 선택 */
        .a {
            font-style: italic;
        }
        .a.c{
            font-style: italic;
            text-decoration: line-through;
        }
        /* 모두 다 섞을 수 있다 (붙여서 작성) */
        h1#title{}
        #title2.a{}
        
        .a.b{
            border-radius: 20%;
        }
    </style>

    <h1>Hello css~~</h1>
    <h1 id="title">Hello css~~</h1> 
    <!-- 아이디는 중복되면 안된다 -->
    <h1 id="title2" class="a">Hello css~~</h1>
    <h1 class="a b c">Hello css~~</h1>
    <h1 class="a b d">Hello css~~</h1>
</body>
</html>
